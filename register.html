<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Register Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 350px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #0056b3; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #004085; }
    </style>
</head>
<body>

    <h2>Register</h2>
    <!-- Məlumatları httpbin.org/post endpoint-inə POST metodu ilə göndərir -->
    <form action="https://httpbin.org/post" method="POST">
        
        <div class="form-group">
            <label for="firstname">First name</label>
            <input type="text" id="firstname" name="firstname" required>
        </div>

        <div class="form-group">
            <label for="lastname">Last name</label>
            <input type="text" id="lastname" name="lastname" required>
        </div>

        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" placeholder="Must be at least 8 characters" required>
        </div>

        <button type="submit">Register</button>
    </form>

</body>
</html>
